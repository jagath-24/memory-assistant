server:
  port: 8080
  tomcat:
    # Reject request bodies larger than 1 MB at the server level
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:memory_assistant}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # NOTE: 'update' is acceptable for local/dev use.
      # For production, switch to 'validate' and use Flyway/Liquibase migrations.
      ddl-auto: update
    show-sql: false
    open-in-view: false   # Disable OSIV to avoid accidental lazy-load queries in controllers
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  # Reject JSON payloads larger than 1 MB
  servlet:
    multipart:
      max-request-size: 1MB
      max-file-size: 1MB

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1/chat/completions
  chat-model: ${GROQ_CHAT_MODEL:qwen/qwen3.8-27b}
  extraction-model: ${GROQ_EXTRACTION_MODEL:openai/gpt-oss-20b}

cors:
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    com.memoryassistant: INFO
    org.springframework.web: WARN
